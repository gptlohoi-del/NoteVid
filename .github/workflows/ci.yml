name: Build debug APK
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Android SDK legacy 'tools' package was removed by Google.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests and assemble debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug -PgithubRepo="${GITHUB_REPOSITORY}" --stacktrace
      - name: Rename debug APK with NoteVid version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^notevidVersionName=//p' gradle.properties | head -n 1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/NoteVid-${VERSION}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: NoteVid-debug-APK
          path: dist/NoteVid-*-debug.apk
          retention-days: 14

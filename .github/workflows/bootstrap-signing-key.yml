name: One-time signing key bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Verify encryption passphrase is configured
        env:
          KEY_BOOTSTRAP_PASSPHRASE: ${{ secrets.KEY_BOOTSTRAP_PASSPHRASE }}
        run: |
          if [ -z "$KEY_BOOTSTRAP_PASSPHRASE" ]; then
            echo 'Set repository secret KEY_BOOTSTRAP_PASSPHRASE before running.' >&2
            exit 1
          fi
      - name: Generate permanent APK signing key, then encrypt backup
        shell: bash
        env:
          KEY_BOOTSTRAP_PASSPHRASE: ${{ secrets.KEY_BOOTSTRAP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/bootstrap"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/bootstrap/notevid-release.jks" \
            -alias notevid -keyalg RSA -keysize 3072 -validity 10000 \
            -dname 'CN=NoteVid, OU=Mobile, O=NoteVid, C=VN' \
            -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" > /dev/null
          printf 'NOTEV_ID_KEY_ALIAS=notevid\nNOTEV_ID_STORE_PASSWORD=%s\nNOTEV_ID_KEY_PASSWORD=%s\n' \
            "$KEY_PASSWORD" "$KEY_PASSWORD" > "$RUNNER_TEMP/bootstrap/credentials.txt"
          tar -czf "$RUNNER_TEMP/notevid-signing-backup.tar.gz" \
            -C "$RUNNER_TEMP/bootstrap" notevid-release.jks credentials.txt
          printf '%s' "$KEY_BOOTSTRAP_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --symmetric --cipher-algo AES256 \
                --output "$RUNNER_TEMP/notevid-signing-backup.tar.gz.gpg" \
                "$RUNNER_TEMP/notevid-signing-backup.tar.gz"
          rm -rf "$RUNNER_TEMP/bootstrap" "$RUNNER_TEMP/notevid-signing-backup.tar.gz"
          mkdir -p signing-artifact
          cp "$RUNNER_TEMP/notevid-signing-backup.tar.gz.gpg" signing-artifact/
      - name: Upload ENCRYPTED key backup (download promptly)
        uses: actions/upload-artifact@v4
        with:
          name: notevid-encrypted-signing-backup
          path: signing-artifact/notevid-signing-backup.tar.gz.gpg
          retention-days: 1
          if-no-files-found: error
